name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Caddy version without leading v. Leave blank to use the v* ref or the default."
        required: false
        type: string
      push_image:
        description: "Push the image to GitHub Container Registry."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DEFAULT_CADDY_VERSION: "2.11.2"
  PLATFORMS: linux/amd64,linux/arm64
  IMAGE_NAME: ghcr.io/ripples-alive/caddy

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve build settings
        id: build
        shell: bash
        run: |
          set -euo pipefail

          version="${DEFAULT_CADDY_VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          push_image="true"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            push_image="false"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            push_image="${{ inputs.push_image }}"
          fi

          tags="${IMAGE_NAME}:${version}"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            tags+=$'\n'"${IMAGE_NAME}:latest"
          fi

          {
            echo "version=${version}"
            echo "push_image=${push_image}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify upstream Caddy tag
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags https://github.com/caddyserver/caddy.git "refs/tags/v${{ steps.build.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.build.outputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          pull: true
          push: ${{ steps.build.outputs.push_image == 'true' }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
          tags: ${{ steps.build.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Caddy with Cloudflare DNS, Tencent Cloud DNS, replace-response, and layer 4 plugins
          cache-from: type=gha
          cache-to: type=gha,mode=max
